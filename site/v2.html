<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>Halftime</title>
<meta name="robots" content="noindex">
<meta name="description" content="Last night, and today: Halftime puts how you slept next to how your studying went.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest-v2.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halftime">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Halftime /v2 (2026-11-16): the decluttered phone app from the declutter brief. Same look as the picked
   Island + Forecast direction: paper ground, ink type, a black card that speaks, one mint accent that means
   "a break / rest". The signature is "the two halves": last night (black) beside today (paper). */
:root{
  --paper:#F4F3EF; --card:#FFFFFF; --ink:#141414; --ink2:#46453F; --muted:#64625C; --line:#E3E1DB; --track:#E6E4DE;
  --night:#000; --on:#FFF; --on2:rgba(255,255,255,.76); --on3:rgba(255,255,255,.56); --well:#1C1C1E; --well2:#2C2C2E;
  --mint:#8ED6BC; --mint-ink:#0F5E46; --now:#B42318;
  --ui:"Geist", system-ui, -apple-system, sans-serif; --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--paper)}
body{min-height:100dvh;background:var(--paper);color:var(--ink);font:400 1rem/1.45 var(--ui);font-variant-numeric:tabular-nums}
body.locked{overflow:hidden}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:3px solid var(--mint-ink);outline-offset:3px;border-radius:10px}
.night :focus-visible,.scard :focus-visible{outline-color:var(--mint)}
::selection{background:rgba(142,214,188,.55);color:var(--ink)}
[hidden]{display:none!important}
main{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 104px) max(20px,env(safe-area-inset-left,0px))}
body:not([data-view="today"]):not([data-view="week"]) main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}

/* top of the tab screens */
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;font:600 1rem/1 var(--ui);letter-spacing:-.01em}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 2px var(--ink) inset}
.link{min-height:44px;padding:0 2px;font:500 .9375rem/1.2 var(--ui);color:var(--ink2);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.link.sm{min-height:0;font-size:inherit;padding:0;vertical-align:baseline}
.date{font:500 .875rem/1.2 var(--ui);color:var(--muted);margin-top:14px}
.title{font:600 2rem/1.08 var(--ui);letter-spacing:-.03em;margin-top:6px;text-wrap:balance}
.lead{font:400 1.0625rem/1.5 var(--ui);color:var(--ink2);margin-top:12px}
.kick{font:500 .875rem/1.2 var(--ui);color:var(--muted);margin-top:18px}
.fine{font:400 .875rem/1.45 var(--ui);color:var(--muted);margin-top:8px}
.fine.center,.center{text-align:center}
.fine.qa{color:var(--now)}
.foot{font:400 .8125rem/1.45 var(--ui);color:var(--muted);margin-top:28px;text-align:center}
.demo{position:sticky;top:0;z-index:4;margin:0 -4px 8px;padding:8px 12px;border-radius:12px;background:var(--ink);color:var(--on);font:500 .8125rem/1.3 var(--mono);text-align:center}

/* the two halves */
.halves{position:relative;display:grid;grid-template-columns:1fr 1fr;margin-top:18px;border-radius:26px;overflow:hidden;background:var(--card);min-height:216px}
.half{display:flex;flex-direction:column;padding:18px 16px 16px;min-width:0}
.half.night{background:var(--night);color:var(--on)}
.hl{font:500 .8125rem/1 var(--ui);letter-spacing:.02em;color:var(--muted)}
.night .hl{color:var(--on3)}
.big{font:300 3.25rem/1 var(--ui);letter-spacing:-.05em;margin-top:18px;white-space:nowrap}
.big small{font:500 1rem/1 var(--ui);letter-spacing:0;margin:0 3px 0 2px;color:var(--muted)}
.night .big small{color:var(--on3)}
.big.none{color:var(--muted)}
.night .big.none{color:var(--on3)}
.hs{font:400 .9375rem/1.35 var(--ui);margin-top:10px;color:var(--ink2)}
.night .hs{color:var(--on2)}
.src{font:400 .8125rem/1.35 var(--ui);color:var(--muted);margin-top:auto;padding-top:12px}
.night .src{color:var(--on3)}
.night .src .link{color:var(--on2)}
.halfbtn.ghost{background:transparent;border:1px solid var(--well2);color:var(--on2);margin-top:10px;font-weight:500}
.halfbtn{margin-top:auto;min-height:44px;border-radius:14px;background:var(--well2);color:var(--on);font:600 .9375rem/1.2 var(--ui);padding:10px 12px;text-align:left}
.heart{display:grid;gap:4px;margin-top:10px;font:400 .8125rem/1.3 var(--ui);color:var(--on2)}
.heart div{display:flex;justify-content:space-between;gap:6px}.heart dd{font-family:var(--mono);color:var(--on)}
.halves.sample .stamp{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:5px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font:500 .75rem/1 var(--mono);color:var(--ink2);white-space:nowrap}
.halves.sample .half{padding-bottom:40px}
.linkline{font:500 1.0625rem/1.45 var(--ui);margin-top:16px;text-wrap:pretty}
.changes{font:400 .9375rem/1.45 var(--ui);color:var(--ink2);margin-top:8px}
.changes b{font-weight:600;color:var(--ink)}
.go{margin-top:22px}
.go .fine{text-align:center}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;padding:12px 18px;border-radius:16px;background:var(--ink);color:var(--paper);font:600 1.0625rem/1.2 var(--ui);text-decoration:none;text-align:center;transition:transform .12s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.big{min-height:58px;border-radius:18px;font-size:1.125rem}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.sm{width:auto;min-height:44px;padding:8px 14px;border-radius:12px;font-size:.9375rem}
.btn.danger{background:var(--now);color:#fff}
.btn.pick{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:60px;font-size:1.125rem}
.btn[disabled]{opacity:.6}
.row{display:flex;gap:8px;margin-top:10px}
.row.wrap{flex-wrap:wrap}
.row.two>.btn{flex:1}
.col{display:grid;gap:10px;margin-top:22px}
/* the action bar is fixed, not sticky: iOS Safari sent taps on a sticky bar to whatever was under it (2026-11-16) */
.stick{position:fixed;left:0;right:0;bottom:0;z-index:6;display:grid;gap:8px;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(20px,env(safe-area-inset-left,0px));background:var(--paper);border-top:1px solid var(--line)}
.stick>*{width:100%;max-width:480px;margin:0 auto}
body.has-stick main{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}
.chip{min-height:44px;padding:0 16px;border-radius:22px;background:var(--card);border:1px solid var(--line);font:500 .9375rem/1 var(--ui)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* cards and notes */
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:14px}
.card h2{font:600 1.0625rem/1.25 var(--ui);letter-spacing:-.01em}
.opt-t{font:400 .8125rem/1 var(--ui);color:var(--muted);margin-left:4px}
.note{margin-top:16px;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.note h2{font:600 1rem/1.3 var(--ui)}
.note p{font:400 .9375rem/1.45 var(--ui);color:var(--ink2);margin-top:4px}
.note.care{background:#EAF6F1;border-color:#CBE7DC}
.steps{margin:10px 0 0 20px;font:400 .9375rem/1.5 var(--ui);color:var(--ink2)}
.input{width:100%;min-height:48px;margin-top:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font-size:1rem}
.val{font:300 2.25rem/1 var(--ui);letter-spacing:-.04em;margin-top:10px}
.stepper{display:flex;align-items:center;gap:14px;margin-top:8px}
.stepper button{width:52px;height:52px;border-radius:50%;background:var(--paper);border:1px solid var(--line);font:400 1.5rem/1 var(--ui)}
.stepper .val{margin-top:0;min-width:7.2ch;text-align:center}
.stepper.big2{justify-content:center;margin:18px 0 6px}
.arm{margin-top:14px}
.clist{list-style:none;display:grid;gap:10px;margin-top:10px;font:400 .9375rem/1.45 var(--ui);color:var(--ink2)}
.clist b{color:var(--ink);font-weight:600}
.opts{display:grid;gap:8px;margin-top:18px}
.opt{display:grid;gap:2px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);min-height:64px}
.opt b{font:600 1.0625rem/1.25 var(--ui)}.opt span{font:400 .875rem/1.35 var(--ui);color:var(--muted)}
.sub{display:flex;align-items:center;justify-content:space-between;min-height:44px;font:500 .8125rem/1 var(--ui);color:var(--muted)}
.back{min-height:44px;padding-right:12px;font:500 1rem/1 var(--ui);color:var(--ink)}

/* the session */
.hero{margin-top:22px;transition:opacity .3s ease}
.hero.dim{opacity:.35}.hero.dim2{opacity:.5;margin-top:26px}
.subj{display:flex;justify-content:space-between;gap:12px;font:500 .875rem/1.2 var(--ui);color:var(--muted)}
.subj span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font:300 5.25rem/.95 var(--ui);letter-spacing:-.055em;margin-top:16px;white-space:nowrap}
.clock small{font:500 1rem/1 var(--ui);letter-spacing:0;color:var(--muted);margin-left:8px}
.since{font:400 1rem/1.35 var(--ui);color:var(--ink2);margin-top:8px}
.quiet{margin-top:6px}
.line{margin-top:30px}
.ll{display:flex;justify-content:space-between;font:500 .875rem/1 var(--ui);color:var(--muted)}
.track{position:relative;height:16px;border-radius:8px;background:var(--track);margin-top:14px}
.track .done{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--ink)}
.track .fill{position:absolute;top:0;bottom:0;border-radius:8px;background:var(--mint)}
.track .slot{position:absolute;top:-6px;bottom:-6px;border-radius:10px;background:rgba(142,214,188,.35);outline:2px dashed var(--mint-ink);outline-offset:-2px}
.nowm{position:absolute;top:-10px;bottom:-10px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--now)}
.stop{position:absolute;right:0;top:50%;width:20px;height:20px;margin-top:-10px;border-radius:6px;background:var(--paper);border:3px solid var(--ink)}
.ticks{display:flex;justify-content:space-between;margin-top:12px;font:500 .75rem/1.25 var(--mono);color:var(--muted)}
.ticks .tn{color:var(--now)}
.acts2{margin-top:26px}
.ask{font:600 1.0625rem/1.3 var(--ui)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:14px;padding:12px 0;border-top:1px solid var(--line);text-align:left;font:500 1rem/1.35 var(--ui)}
.sw small{font:400 .8125rem/1.35 var(--ui);color:var(--muted)}
.sw i,.srow .tg{flex:none;width:48px;height:30px;border-radius:15px;background:var(--track);position:relative;transition:background .2s ease}
.sw i::after,.srow .tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s var(--ease)}
.sw[aria-checked="true"] i,.srow[aria-checked="true"] .tg{background:var(--mint-ink)}
.sw[aria-checked="true"] i::after,.srow[aria-checked="true"] .tg::after{transform:translateX(18px)}

/* the suggestion card (black: it speaks) */
.scard{margin-top:22px;padding:20px 20px 16px;border-radius:28px;background:var(--night);color:var(--on);animation:rise .32s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.status{display:flex;justify-content:space-between;gap:10px;font:500 .75rem/1.2 var(--mono);color:var(--on3)}
.q{font:600 2rem/1.05 var(--ui);letter-spacing:-.03em;margin-top:14px;text-wrap:balance}
.q.q2{font-size:1.625rem}
.subq{font:500 1rem/1.35 var(--ui);color:var(--mint);margin-top:6px}
.why{font:400 1rem/1.5 var(--ui);color:var(--on2);margin-top:10px}
.why b{color:var(--on);font-weight:500}
.n{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:7px;background:var(--well2);color:var(--on2);font:500 .75rem/1 var(--mono);margin-left:4px;vertical-align:1px}
.nw{white-space:nowrap}
.sure{display:flex;align-items:flex-start;gap:10px;margin-top:12px;font:400 .875rem/1.4 var(--ui);color:var(--on2)}
.sure .tag{flex:none;font:500 .75rem/1 var(--mono);color:var(--on);border:1px solid var(--on3);border-radius:999px;padding:5px 9px;margin-top:1px}
.evs{display:grid;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--well2)}
.ev{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font:400 .875rem/1.35 var(--ui)}
.ev .k{color:var(--on2)}.ev .v{font-family:var(--mono);color:var(--on);text-align:right}.ev .m{grid-column:1/-1;color:var(--on3);font-size:.8125rem}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.a{min-height:52px;border-radius:26px;font:600 1rem/1.2 var(--ui)}
.a.yes{background:var(--on);color:#000}.a.no{background:var(--well2);color:var(--on)}
.links{display:flex;flex-wrap:wrap;gap:0 14px;margin-top:8px}
.links button{min-height:44px;min-width:44px;font:500 .875rem/1.2 var(--ui);color:var(--on2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--on3)}
.rungs{display:grid;gap:8px;margin-top:14px}
.rung{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:16px;background:var(--well);min-height:58px}
.rung b{font:600 1rem/1.2 var(--ui)}.rung span{font:400 .875rem/1.3 var(--ui);color:var(--on3)}
.brk .bleft{font:300 4.5rem/1 var(--ui);letter-spacing:-.05em;color:var(--mint);margin-top:14px}

/* check-in and done */
.keptbar{height:14px;border-radius:7px;background:var(--track);margin-top:16px;overflow:hidden}
.keptbar i{display:block;height:100%;background:var(--ink);border-radius:7px}
.sus{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:22px}
.sus button{min-height:56px;border-radius:14px;background:var(--card);border:1px solid var(--line);font:600 1.125rem/1 var(--ui)}
.susl{display:flex;justify-content:space-between;margin-top:8px;font:400 .8125rem/1.3 var(--ui);color:var(--muted)}
.susq{font-size:1.5rem;line-height:1.2}

/* week */
.phead{display:grid;grid-template-columns:3.6rem 1fr 1fr;gap:10px;font:500 .75rem/1 var(--ui);color:var(--muted);padding-bottom:8px;border-bottom:1px solid var(--line)}
.pairs{list-style:none}
.pair{display:grid;grid-template-columns:3.6rem 1fr 1fr;gap:10px;align-items:center;min-height:46px;border-bottom:1px solid var(--line)}
.pair:last-child{border-bottom:0}
.pd{font:500 .875rem/1.2 var(--ui);color:var(--ink2)}
.pn,.pk{display:flex;align-items:center;gap:8px;min-width:0}
.pn b,.pk b{font:500 .8125rem/1 var(--mono);white-space:nowrap}
.pk small{font-size:.75rem;color:var(--muted)}
.pn sup{font-size:.625rem;margin-left:1px;color:var(--ink2)}
.bar{position:relative;flex:1;min-width:24px;height:10px;border-radius:5px;background:var(--track)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink)}
.bar.day i{background:var(--mint-ink)}
.bar.short i{background:var(--card);box-shadow:inset 0 0 0 2px var(--ink)}
.bar em{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--now);border-radius:1px}
.dash{color:var(--muted);font:500 .875rem/1 var(--mono)}
.prog{display:flex;gap:6px;margin-top:12px}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--track)}
.prog i.on{background:var(--ink)}
.ls{font:500 1rem/1.45 var(--ui);margin-top:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cmp div{display:grid;gap:4px;padding:12px;border-radius:14px;background:var(--paper)}
.cmp span{font:500 .8125rem/1.25 var(--ui);color:var(--muted)}
.cmp b{font:300 1.75rem/1 var(--ui);letter-spacing:-.03em}.cmp b small{font:500 .8125rem/1 var(--ui);letter-spacing:0;color:var(--muted)}
.cmp em{font:400 .8125rem/1 var(--mono);font-style:normal;color:var(--muted)}
.how{margin-top:6px;display:grid;gap:8px;font:400 .9375rem/1.5 var(--ui);color:var(--ink2)}
.card .link.sm{display:inline-block;margin-top:12px;min-height:44px;line-height:44px}
.log{list-style:none;margin-top:8px}
.log li{display:grid;grid-template-columns:4.6rem 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font:400 .9375rem/1.35 var(--ui)}
.log li:last-child{border-bottom:0}
.log .when{font:500 .75rem/1.35 var(--mono);color:var(--muted)}
.log .what{font-size:.8125rem;color:var(--muted)}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(244,243,239,.96);border-top:1px solid var(--line);padding:0 max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(12px,env(safe-area-inset-left,0px))}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;font:500 .8125rem/1 var(--ui);color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs svg{width:24px;height:24px}

/* sheet */
/* hidden, not just transparent: Safari tints its status and tool bars from fixed elements at the edges */
.scrim{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.36);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s linear .2s}
.scrim.on{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:560px;margin:0 auto;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--paper);border-radius:26px 26px 0 0;padding:8px max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(20px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .28s var(--ease);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sh-t{font:600 1.5rem/1.15 var(--ui);letter-spacing:-.02em}
.sh-l{font:600 .8125rem/1 var(--ui);color:var(--muted);margin-top:20px;letter-spacing:.02em}
.sh-p{font:400 .9375rem/1.5 var(--ui);color:var(--ink2);margin-top:8px}
.reads{list-style:none;display:grid;gap:10px;margin-top:10px}
.reads li{display:grid;gap:2px;padding:12px 14px;border-radius:14px;background:var(--card);font:400 .9375rem/1.4 var(--ui)}
.reads span{color:var(--ink2);font-size:.875rem}
.rows{display:grid;margin-top:10px;border-radius:16px;overflow:hidden;background:var(--card)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:58px;padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow b{display:block;font:500 1rem/1.3 var(--ui)}.srow small{display:block;font:400 .8125rem/1.35 var(--ui);color:var(--muted)}
