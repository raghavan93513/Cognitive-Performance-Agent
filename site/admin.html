<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Halftime Admin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F3EF;--card:#FFFFFF;--ink:#141414;--ink2:#46453F;--ink3:#6E6B64;--line:#E2DFD7;--mint:#8ED6BC;--mint-ink:#0F5E46;--mint-bg:#E3F3EC;--warn:#A1401C;--warn-bg:#F7E6DE;
  --ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,Menlo,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#121211;--card:#1B1B19;--ink:#F1F0EC;--ink2:#C9C7C0;--ink3:#9A978F;--line:#2C2B28;--mint:#8ED6BC;--mint-ink:#8ED6BC;--mint-bg:#16302A;--warn:#F0A07E;--warn-bg:#3A2219;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 .9375rem/1.45 var(--ui);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
::selection{background:var(--mint);color:#141414}
:focus-visible{outline:2px solid var(--mint-ink);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono)}
.muted{color:var(--ink3)}
[hidden]{display:none!important}

/* sign in */
#login{min-height:100svh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left))}
#login form{width:min(360px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px 24px;display:grid;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.pill{width:34px;height:14px;border-radius:7px;background:#141414;position:relative;flex:none}
.pill::after{content:"";position:absolute;left:5px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--mint)}
#login h1{margin:4px 0 0;font-size:1.5rem;letter-spacing:-.02em}
label{display:grid;gap:6px;font-size:.8125rem;color:var(--ink2)}
input[type=text],input[type=password],input[type=search]{height:44px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:0 12px;font-size:1rem}
.btn{height:44px;border:0;border-radius:22px;background:var(--ink);color:var(--paper);font-weight:600;padding:0 18px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--warn);font-size:.875rem;min-height:1.2em;margin:0}

/* shell */
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;max-width:1280px;margin:0 auto}
.bar .brand{margin-right:auto}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 10px;min-height:36px;font-size:.8125rem;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--ink2);min-height:44px;padding:0 4px;cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--ink)}
.small{font-size:.8125rem}
.tiny{font-size:.75rem}
.iconbtn{height:34px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 12px;font-size:.8125rem}
nav{max-width:1280px;margin:8px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:8px 12px;border-radius:10px;font-size:.875rem;color:var(--ink2);white-space:nowrap}
nav button[aria-current=page]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px var(--line)}
main{max-width:1280px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
.status{display:flex;gap:10px;align-items:center;font-size:.75rem;color:var(--ink3);margin:-6px 0 14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint)}
.dot.off{background:var(--ink3)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;min-width:0}
.card h2{font-size:1rem;margin:0 0 2px;letter-spacing:-.01em}
.card .sub{font-size:.8125rem;color:var(--ink3);margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:500 1.5rem/1.15 var(--mono);letter-spacing:-.02em}
.kpi span{font-size:.75rem;color:var(--ink3)}
.kpi.warn b{color:var(--warn)}
.live{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.live b{font:500 3rem/1 var(--mono);letter-spacing:-.04em}
.live .lbl{font-size:.875rem;color:var(--ink2)}

table{width:100%;border-collapse:collapse;font-size:.8125rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--ink3);font-size:.75rem;white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--mint-bg)}
.tag{display:inline-block;font:500 .75rem/1.6 var(--mono);padding:0 6px;border-radius:6px;background:var(--paper);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.tag.m{background:var(--mint-bg);border-color:transparent;color:var(--mint-ink)}
.tag.w{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.bars{display:grid;gap:8px}
.brow{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr auto;gap:10px;align-items:center;font-size:.8125rem}
.brow .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .trk{height:10px;background:var(--paper);border-radius:5px;overflow:hidden}
.brow .fill{height:100%;background:var(--ink);border-radius:5px;transform-origin:left;transition:transform .5s cubic-bezier(.23,1,.32,1)}
.brow .fill.m{background:var(--mint-ink)}
.brow .val{font-family:var(--mono);font-size:.8125rem;white-space:nowrap;text-align:right;min-width:70px}
.funnel .brow{grid-template-columns:minmax(150px,1.3fr) 3fr 120px}
.drop{font-size:.75rem;color:var(--warn);font-family:var(--mono)}

.chart{width:100%;height:150px;display:block}
.chart text{font:400 10px var(--mono);fill:var(--ink3)}
.feed{display:grid;gap:0;max-height:420px;overflow:auto;font-size:.8125rem}
.feed div{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.feed div:last-child{border-bottom:0}

.heat{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.heat{grid-template-columns:1fr}}
.phone{position:relative;width:100%;max-width:320px;aspect-ratio:390/844;border-radius:28px;overflow:hidden;border:6px solid #141414;background:#F4F3EF;justify-self:center}
.phone.desk{max-width:100%;aspect-ratio:1440/900;border-radius:12px;border-width:4px}
.phone iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;pointer-events:none;background:#F4F3EF}
.phone canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
select{height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 8px;font-size:.8125rem;max-width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--ink3);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

#drawer{position:fixed;inset:0;z-index:20;background:rgba(10,10,10,.4);display:flex;justify-content:flex-end}
#drawer .panel{width:min(640px,100%);height:100%;background:var(--paper);overflow:auto;padding:20px max(16px,env(safe-area-inset-right)) 40px 20px;box-shadow:-12px 0 32px rgba(0,0,0,.2);
  animation:in .28s cubic-bezier(.23,1,.32,1)}
@keyframes in{from{transform:translateX(24px);opacity:.4}}
@media (prefers-reduced-motion:reduce){#drawer .panel{animation:none}.brow .fill{transition:none}}
.tl{display:grid;gap:0;font-size:.8125rem}
.tl .ses{font:500 .75rem var(--mono);color:var(--ink3);padding:14px 0 6px}
.tl .ev{display:grid;grid-template-columns:70px 120px 1fr;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.empty{color:var(--ink3);font-size:.875rem;padding:8px 0}
.note{font-size:.8125rem;color:var(--ink3);margin:14px 0 0}
</style>
</head>
<body>
<section id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <div class="brand"><span class="pill" aria-hidden="true"></span>Halftime</div>
    <h1>Admin</h1>
    <label>Username<input id="user" type="text" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></label>
    <label>Password<input id="pass" type="password" name="password" autocomplete="current-password" required></label>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" type="submit">Sign in</button>
  </form>
</section>

<div id="app" hidden>
  <header>
    <div class="bar">
      <div class="brand"><span class="pill" aria-hidden="true"></span>Halftime <span class="muted" style="font-weight:400">admin</span></div>
      <div class="seg" role="group" aria-label="Time range" id="range">
        <button data-r="live">Live 30 min</button><button data-r="today">Today</button><button data-r="24h">24 h</button><button data-r="7d">7 days</button><button data-r="all">All</button>
      </div>
      <label class="chk"><input type="checkbox" id="tests"> Load tests</label>
      <button class="iconbtn" id="export" type="button">Export CSV</button>
      <button class="iconbtn" id="pwbtn" type="button">Password</button>
      <button class="iconbtn" id="logout" type="button">Sign out</button>
    </div>
    <nav id="tabs" aria-label="Sections">
      <button data-v="pulse">Pulse</button><button data-v="funnel">Funnel</button><button data-v="screens">Screens</button><button data-v="tour">Tour</button>
      <button data-v="taps">Taps &amp; heat map</button><button data-v="visitors">Visitors</button><button data-v="devices">Devices &amp; places</button><button data-v="health">Health</button>
    </nav>
  </header>
  <main>
    <div class="status"><span class="dot" id="sdot"></span><span id="stext">Loading…</span></div>
    <div id="view"></div>
  </main>
</div>

<div id="drawer" hidden><div class="panel" role="dialog" aria-modal="true" aria-label="Details" id="panel"></div></div>
<script src="/assets/admin.js"></script>
</body>
</html>
