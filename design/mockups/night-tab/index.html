<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Night tab mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F3EF;--ink:#141414;--muted:#64625C;--line:#E3E1DB}
*{box-sizing:border-box;margin:0}
body{background:#E9E7E1;color:var(--ink);font:400 15px/1.5 "Geist",system-ui,sans-serif;padding:28px 16px 60px}
header{max-width:1400px;margin:0 auto 18px}
h1{font-size:24px;letter-spacing:-.02em}
p{color:var(--muted);max-width:760px}
.tabs{display:flex;gap:8px;margin-top:14px}
.tabs button{font:500 14px/1 inherit;font-family:inherit;min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
figure{display:flex;flex-direction:column;align-items:center}
.phone{width:300px;height:650px;border-radius:44px;background:#111;padding:10px;box-shadow:0 20px 40px rgba(0,0,0,.18)}
.phone iframe{width:390px;height:844px;border:0;border-radius:34px;transform:scale(.7179);transform-origin:0 0;background:var(--paper)}
.clip{width:280px;height:630px;border-radius:34px;overflow:hidden}
figcaption{margin-top:10px;font-weight:500;text-align:center}
figcaption span{display:block;font-weight:400;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header>
  <h1>Night tab · phone mockups</h1>
  <p>A new bottom-bar tab next to Demo. Three numbers against your usual, one sentence, and what it changes today. Sample data. Tap a phone to open it full size.</p>
  <div class="tabs"><button type="button" data-d="a" aria-pressed="true">A · The night, drawn</button><button type="button" data-d="b" aria-pressed="false">B · Three lines</button></div>
</header>
<div class="grid" id="grid"></div>
<script>
const STATES = [["ok", "Short night", "the common case"], ["usual", "A usual night", "nothing changes"], ["confirm", "First morning", "is this when you slept?"],
  ["learning", "Learning", "3 of 7 nights"], ["nodata", "Not enough data", "worn 2 h 10 min"], ["phone", "On the phone", "not synced from the laptop yet"]];
function draw(d) {
  document.getElementById("grid").innerHTML = STATES.map(([k, t, s]) => `<figure><a class="phone" href="night.html?dir=${d}&state=${k}" target="_blank" aria-label="${t}, open full size"><div class="clip"><iframe src="night.html?dir=${d}&state=${k}" title="${t}" tabindex="-1"></iframe></div></a><figcaption>${t}<span>${s}</span></figcaption></figure>`).join("");
  document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.d === d));
}
document.querySelectorAll(".tabs button").forEach((b) => (b.onclick = () => draw(b.dataset.d)));
draw(new URLSearchParams(location.search).get("dir") === "b" ? "b" : "a");
</script>
</body>
</html>
