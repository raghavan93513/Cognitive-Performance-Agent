<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F3EF">
<title>Halftime · Island + Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* UIUX seat, round 3: the team picked the Island and round 1's B "Forecast".
   The page is the forecast: your session drawn as a line from when you started to your next stop.
   The island is the voice: it sits small, springs open once at a pause, and when it suggests a walk
   the slot for that walk lights up on the line below, before Chem lab. Accept, and the island
   becomes a live countdown while the walk slot fills in. */
:root{
  --paper:#F4F3EF; --ink:#141414; --ink2:#46453F; --muted:#64625C; --line:#E3E1DB; --track:#E6E4DE;
  --island:#000; --on:#FFF; --on2:rgba(255,255,255,.74); --on3:rgba(255,255,255,.5); --well:#1C1C1E; --well2:#2C2C2E;
  --done:#1C1C1E; --refill:#8ED6BC; --refill-ink:#0F5E46; --slot:#8ED6BC; --now:#E5484D;
  --ui:"Geist", system-ui, -apple-system, sans-serif; --mono:"Geist Mono", ui-monospace, Menlo, monospace;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.23,1,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--paper)}
body{min-height:100dvh;background:var(--paper);color:var(--ink);font:400 16px/1.45 var(--ui);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid #5AA9FF;outline-offset:3px;border-radius:12px}
.page{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 64px) 20px calc(env(safe-area-inset-bottom,0px) + 10px)}
/* hero: the session clock (dims when the island speaks) */
.hero{transition:opacity .35s ease,filter .35s ease}
.speaking .hero{opacity:.12;filter:blur(3px)}
.subject{display:flex;justify-content:space-between;font:500 13px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.clock{font:300 96px/.9 var(--ui);letter-spacing:-.055em;margin-top:18px}
.clock small{font:500 17px/1 var(--ui);letter-spacing:0;color:var(--muted);margin-left:10px}
.since{font:400 15px/1.3 var(--ui);color:var(--ink2);margin-top:8px}
/* the forecast line (the signature; stays sharp when the island speaks) */
.forecast{margin-top:34px;position:relative;z-index:1}
.stack{transition:transform .5s var(--spring);will-change:transform}
.flabel{display:flex;justify-content:space-between;font:500 13px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.track{position:relative;height:18px;border-radius:9px;background:var(--track);margin-top:16px}
.done{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--done)}
.slot{position:absolute;top:-8px;bottom:-8px;border-radius:12px;background:rgba(142,214,188,.35);outline:2px dashed var(--refill-ink);outline-offset:-2px;opacity:0;transform:scaleX(.6);transform-origin:left;transition:opacity .3s ease .25s,transform .5s var(--spring) .25s}
.suggesting .slot{opacity:1;transform:none}
.fill{position:absolute;top:0;bottom:0;border-radius:9px;background:var(--refill);width:0;transition:width .6s var(--spring)}
.walking .fill{width:4.4%}
.nowmark{position:absolute;top:-12px;bottom:-12px;width:3px;margin-left:-1.5px;border-radius:2px;background:var(--now)}
.stop{position:absolute;right:0;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:6px;background:var(--paper);border:3px solid var(--ink)}
.check{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--muted);opacity:0}
.keeping .check{opacity:1}
.ticks{position:relative;height:32px;margin-top:12px;font:500 12.5px/1.25 var(--mono);color:var(--muted)}
.ticks span{position:absolute;top:0;white-space:nowrap}
.ticks .t-now{color:#B42318;font-weight:500}
.ticks .t-slot{color:var(--refill-ink);opacity:0;transition:opacity .3s ease .4s}
.suggesting .t-slot,.walking .t-slot{opacity:1}
.ticks .t-check{opacity:0}.keeping .t-check{opacity:1}
.next{display:flex;align-items:center;gap:12px;margin-top:auto;padding:14px 16px;border-radius:18px;background:#FFFFFF;border:1px solid var(--line)}
.next .sq{width:14px;height:14px;border-radius:4px;border:3px solid var(--ink);flex:none}
.next b{font-weight:600}.next span{color:var(--ink2);font-size:15px}
.foot{display:flex;justify-content:space-between;margin-top:10px}
.foot button{min-height:44px;font:500 13px/1 var(--ui);color:var(--muted)}
.sample{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 54px);font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;pointer-events:none}
/* the island */
.island{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);z-index:5;background:var(--island);color:var(--on);border-radius:22px;overflow:hidden;width:170px;height:40px;
  transition:width .5s var(--spring),height .5s var(--spring),border-radius .5s var(--spring);box-shadow:0 12px 32px rgba(0,0,0,.2)}
.island.open{border-radius:38px}
.compact{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 13px;font:500 15px/1 var(--mono);transition:opacity .2s ease}
.compact .l{display:flex;align-items:center;gap:8px}
.compact .dot{width:8px;height:8px;border-radius:50%;background:var(--refill)}
.island.open .compact{opacity:0;pointer-events:none}
.full{padding:20px 22px 16px;opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top center;transition:opacity .25s ease .12s,transform .45s var(--spring) .08s}
.island.open .full{opacity:1;transform:none}
.status{display:flex;justify-content:space-between;align-items:center;font:500 12.5px/1 var(--mono);color:var(--on3)}
.q{font:600 32px/1.05 var(--ui);letter-spacing:-.03em;margin-top:14px;text-wrap:balance}
.sub{font:500 16px/1.35 var(--ui);color:var(--refill);margin-top:6px}
.why{font:400 15.5px/1.45 var(--ui);color:var(--on2);margin-top:10px}
.why b{color:var(--on);font-weight:500}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:7px;background:var(--well2);color:var(--on2);font:500 12px/1 var(--mono);margin-left:4px;vertical-align:1px;position:relative}
.chip::after{content:"";position:absolute;inset:-10px -4px}
.nw{white-space:nowrap}
.sure{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px;color:var(--on2)}
.sure{align-items:flex-start}
.sure .tag{flex:none;font:500 12px/1 var(--mono);color:var(--on);border:1px solid var(--on3);border-radius:999px;padding:5px 9px;margin-top:1px}
.ctx{display:block;width:100%;min-height:44px;margin-top:8px;border-radius:14px;border:1px dashed var(--well2);font:500 14px/1.2 var(--ui);color:var(--on2)}
.nights{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.night{min-height:50px;border-radius:12px;background:var(--well);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:500 12px/1 var(--mono);color:var(--on3);position:relative}
.night b{font:600 13px/1 var(--mono);color:var(--on)}
.night.short b{color:#F2B8A0}
.night.on{background:var(--refill);color:#0B3D2E}.night.on b{color:#000}
.night .cal{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:#5AA9FF}
.night.on .cal{background:#1F6FD1}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.reason{min-height:44px;padding:0 14px;border-radius:22px;background:var(--well2);font:500 14px/1 var(--ui);color:var(--on2)}
.reason[aria-pressed="true"]{background:var(--on);color:#000}
.tally{font:400 14px/1.4 var(--ui);color:var(--on2);margin-top:12px}
.tally b{color:var(--on);font-weight:600}
.tally.note{color:var(--refill)}
.morning .forecast,.morning .next{visibility:hidden}
/* never taller than the screen: the open island scrolls inside itself */
.island{max-height:calc(100dvh - env(safe-area-inset-top,0px) - 20px)}
.island.open .full{max-height:calc(100dvh - env(safe-area-inset-top,0px) - 20px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.a{min-height:54px;border-radius:27px;font:600 17px/1 var(--ui);transition:transform .12s var(--ease)}
.a:active{transform:scale(.96)}
.a.yes{background:var(--on);color:#000}.a.no{background:var(--well2);color:var(--on)}
.links{display:flex;justify-content:space-between;margin-top:4px}
.links{gap:12px}
.links button{min-height:44px;font:500 14px/1 var(--ui);color:var(--on2)}
.ev{margin-top:14px;display:grid;gap:12px;border-top:1px solid var(--well2);padding-top:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.row .k{font:500 14px/1.3 var(--ui)}.row .val{font:500 14px/1.3 var(--mono)}
.row .m{grid-column:1/-1;font:400 12px/1.3 var(--mono);color:var(--on3)}
.rng{grid-column:1/-1;position:relative;height:6px;border-radius:3px;background:var(--well2);margin-top:6px}
.rng span{position:absolute;top:0;bottom:0;border-radius:3px;background:#4A4A4E}
.rng em{position:absolute;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--on);border:2px solid #000}
.ladder{display:grid;gap:8px;margin-top:14px}
.rung{text-align:left;background:var(--well);border-radius:18px;padding:12px 16px;min-height:58px}
.rung b{display:block;font:600 16px/1.25 var(--ui)}.rung span{font:400 13px/1.3 var(--ui);color:var(--on2)}
.rung.first{background:var(--on);color:#000}.rung.first span{color:#333}
.learn{display:flex;gap:5px;margin-top:14px}.learn i{flex:1;height:6px;border-radius:3px;background:var(--well2)}.learn i.on{background:var(--refill)}
/* live activity (compact, while walking) */
.island.live{width:min(340px,calc(100vw - 24px))}
.liveview{position:absolute;inset:0;display:none;align-items:center;justify-content:space-between;padding:0 18px 0 12px}
.island.live .liveview{display:flex}.island.live .compact{opacity:0}
.liveview .l{display:flex;align-items:center;gap:10px;font:500 15px/1 var(--ui)}
.liveview .t{font:400 26px/1 var(--ui);letter-spacing:-.03em;color:var(--refill)}
.foot{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.foot .smp{font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.foot button:last-child{justify-self:end}
@media (prefers-reduced-motion:reduce){.island,.full,.compact,.slot,.fill,.hero{transition:opacity .2s ease!important}.full,.slot{transform:none}}
@media (max-height:700px){.clock{font-size:68px;margin-top:10px}.q{font-size:27px}.full{padding:16px 18px 12px}.next{padding:10px 14px}.forecast{margin-top:18px}}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="stack" id="stack">
  <section class="hero" aria-label="This session">
    <p class="subject" id="subj"><span>Organic chemistry</span><span>Started 1:05 pm</span></p>
    <p class="clock" id="clock">2:40<small>studying</small></p>
    <p class="since" id="since">No break yet this session.</p>
  </section>
  <section class="forecast" aria-label="Your session as a line, up to Chem lab at 4:30 pm">
    <p class="flabel"><span>This session</span><span id="flabel">up to your next stop</span></p>
    <div class="track" role="img" aria-label="Started 1:05 pm. Now 3:45 pm. A 5-minute walk fits now. Chem lab at 4:30 pm.">
      <span class="done" style="width:78%"></span>
      <span class="slot" style="left:78.6%;width:5%"></span>
      <span class="fill" style="left:78.6%"></span>
      <span class="check" style="left:87%"></span>
      <span class="nowmark" id="nowmark" style="left:78%"></span>
      <span class="stop" aria-hidden="true"></span>
    </div>
    <div class="ticks" aria-hidden="true">
      <span style="left:0">1:05 pm</span>
      <span class="t-now" id="tnow" style="left:78%;transform:translateX(-50%)">now 3:45</span>
      <span class="t-slot" style="left:81%;top:16px;transform:translateX(-50%)">walk · back 3:50</span>
      <span class="t-check" style="left:87%;top:16px;transform:translateX(-50%)">next check 4:05</span>
      <span style="right:0">4:30</span>
    </div>
  </section>
  </div>
  <div class="next"><span class="sq" aria-hidden="true"></span><p><b>Chem lab · 4:30 pm</b><br><span>45 min from now · from your calendar</span></p></div>
  <nav class="foot"><button>Talk to someone</button><span class="smp">Sample data</span><button>Pause suggestions</button></nav>
</div>

<div class="island" id="island" role="region" aria-label="Halftime">
  <button class="compact" id="compact" aria-label="Open Halftime"><span class="l"><span class="dot"></span><span id="ctime">2:40</span></span>
    <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="#2C2C2E" stroke-width="3"/><circle cx="10" cy="10" r="8" fill="none" stroke="#8ED6BC" stroke-width="3" stroke-dasharray="50.3" stroke-dashoffset="11" transform="rotate(-90 10 10)" stroke-linecap="round"/></svg></button>
  <button class="liveview" id="liveview" aria-label="Walk break, 4 minutes 12 seconds left. Open."><span class="l">
    <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="#2C2C2E" stroke-width="4"/><circle cx="13" cy="13" r="10" fill="none" stroke="#8ED6BC" stroke-width="4" stroke-dasharray="62.8" stroke-dashoffset="10" transform="rotate(-90 13 13)" stroke-linecap="round"/></svg>Walk</span><span class="t">4:12</span></button>
  <div class="full" id="full"></div>
</div>

<script>
// Sample data only. Words: UIUX proposal on the CMO seat's voice A (COPY.md); the CMO locks them.
const island = document.getElementById("island"), full = document.getElementById("full"), page = document.getElementById("page");
const chip = (k, l) => `<button class="chip" aria-label="Source ${k}: ${l}">${k}</button>`;
const walkBody = (withWhy) => `<div class="status"><span>Halftime · now 3:45</span><span>45 min to Chem lab</span></div>
  <h1 class="q">Short walk now?</h1>
  <p class="sub">5 minutes fits. You'll be back by 3:50, well before lab${chip(4, "next class, calendar")}.</p>
  <p class="why">You've been at it <b class="nw">2 h 40 min</b>${chip(1, "session time, laptop")}, with <b class="nw">14 app switches</b> in 20 min${chip(2, "app switches, laptop")}, and slept <b class="nw">5 h 10 min</b>${chip(3, "sleep, watch or ring")}.</p>
  <p class="sure"><span class="tag">Early read</span><span>In 4 of your last 6 afternoons like this, your app switching settled back to usual after a walk.</span></p>
  ${withWhy ? `<div class="ev">
    <div class="row"><span class="k">1 · Session time</span><span class="val">2 h 40 min</span><span class="m">laptop · 1 min ago · usual 45–90 min</span><span class="rng"><span style="left:25%;width:25%"></span><em style="left:89%"></em></span></div>
    <div class="row"><span class="k">2 · App switches</span><span class="val">14 / 20 min</span><span class="m">laptop · 1 min ago · usual 5–8</span><span class="rng"><span style="left:25%;width:15%"></span><em style="left:70%"></em></span></div>
    <div class="row"><span class="k">3 · Sleep last night</span><span class="val">5 h 10 min</span><span class="m">watch or ring · synced 38 min ago · usual about 7 h</span></div>
    <div class="row"><span class="k">4 · Next class</span><span class="val">Chem lab 4:30</span><span class="m">calendar · you turned this on · next class and away games · we never use your location</span></div>
    <p class="m" style="font:400 12px/1.4 var(--mono);color:var(--on3)">"Early read" means under 10 afternoons like this so far. On the laptop we only see which kind of app you're in, never what you type, read or browse.</p></div>` : ""}
  <div class="acts"><button class="a yes" data-go="running">Walk 5 min</button><button class="a no" data-go="keep">Keep going</button></div>
  <div class="links">${withWhy ? `<button data-go="snooze">Snooze 20 min</button><button data-go="wrong">This looks wrong</button><button data-go="walk">Hide why</button>` : `<button data-go="snooze">Snooze 20 min</button><button data-go="why">See why</button>`}</div>`;
const V = {
  walk: () => walkBody(false),
  why: () => walkBody(true),
  runopen: () => `<div class="status"><span>Halftime · walking</span><span>back 3:50 pm</span></div>
    <h1 class="q" style="font-weight:300;font-size:64px;letter-spacing:-.05em;color:var(--refill)">4:12</h1>
    <p class="why">Your study clock is paused at 2:40. Walk, water, window. Back by 3:50, still 40 min before lab.</p>
    <div class="acts"><button class="a no" data-go="keep">End break</button><button class="a no">+5 min</button></div>
    <div class="links"><button data-go="running">Make it small</button></div>`,
  keep: () => `<div class="status"><span>Halftime · check-in</span><span>45 min to Chem lab</span></div>
    <h1 class="q">OK, keep going.</h1>
    <p class="sub">Your call. I'll check in again around 4:05.</p>
    <p class="why">The reasons haven't changed: you've been at it <b class="nw">2 h 40 min</b>${chip(1, "session time, laptop")} and slept <b class="nw">5 h 10 min</b>${chip(3, "sleep, watch or ring")}, under your usual 7 h. The walk still fits before lab if you want it later.</p>
    <div class="acts"><button class="a yes" data-go="idle">Got it</button><button class="a no" data-go="running">Walk now</button></div>`,
  nodata: () => `<div class="status"><span>Halftime · learning</span><span>4 of 7 nights</span></div>
    <h1 class="q" style="font-size:27px">Still learning your usual sleep.</h1>
    <div class="learn" role="img" aria-label="4 of 7 nights">${[1,1,1,1,0,0,0].map((x) => `<i class="${x ? "on" : ""}"></i>`).join("")}</div>
    <p class="why">Suggestions start around Sunday. For now the line below is what we know: <b>2 h 40 min</b> in, lab at 4:30.</p>
    <div class="acts"><button class="a no" data-go="idle">Keep going</button><button class="a no" data-go="running">Walk 5 min</button></div>`,
  escalate: () => `<div class="status"><span>Halftime · morning</span><span>only you see this</span></div>
    <h1 class="q" style="font-size:26px;line-height:1.12">Sleep's been short for a while. Want to talk it over with someone?</h1>
    <p class="why">Leaving out the 3 away-game nights on your calendar, 9 of your last 11 nights were under 6 hours${chip(3, "sleep, watch or ring")}. You choose if and when. Nothing is shared.</p>
    <div class="ladder"><button class="rung first"><b>Book a time to talk</b><span>[Counseling booking: confirm]</span></button>
      <button class="rung"><b>Talk to someone now</b><span>[Campus counseling, 24/7: confirm]</span></button>
      <button class="rung"><b>Something for right now</b><span>2 quiet minutes</span></button></div>
    <button class="ctx" data-go="escctx">Some were travel, games, shifts or exams?</button>
    <div class="links"><button data-go="escnot">Not now</button><button data-go="escwhy">Why am I seeing this?</button></div>`,
  escwhy: () => `<div class="status"><span>Halftime · morning</span><span>only you see this</span></div>
    <h1 class="q" style="font-size:24px;line-height:1.15">Why you're seeing this</h1>
    <div class="ev"><div class="row"><span class="k">3 · Sleep, last 14 nights</span><span class="val">9 of 11 under 6 h</span><span class="m">watch or ring · usual about 7 h · 3 away-game nights left out</span></div></div>
    <p class="why">We bring this up after two weeks of mostly short nights, and only in the morning, never while you're studying. It's not a diagnosis. It's a nudge to talk to a person, if you want to.</p>
    <div class="acts"><button class="a no" data-go="escalate">Back</button><button class="a no" data-go="escnot">Not now</button></div>`,
  escctx: () => {
    const left = NIGHTS.filter((_, i) => !excused(i)), short = left.filter((n) => n.h < 6).length;
    return `<div class="status"><span>Halftime · morning</span><span>only you see this</span></div>
    <h1 class="q" style="font-size:24px;line-height:1.15">Which nights were they?</h1>
    <p class="tally" style="margin-top:6px">Pick a reason, then tap the nights it explains.</p>
    <div class="reasons" role="group" aria-label="What were they">${REASONS.map((r) => `<button class="reason" data-reason="${r}" aria-pressed="${r === reason}">${r}</button>`).join("")}</div>
    <div class="nights" role="group" aria-label="Last 14 nights. Tap to mark.">${NIGHTS.map((n, i) => `<button class="night${n.h < 6 ? " short" : ""}${marked.has(i) ? " on" : ""}" data-night="${i}" aria-pressed="${marked.has(i)}" aria-label="${n.d}, ${n.h} hours${n.cal ? ", " + n.cal + " on your calendar" : ""}">${n.cal ? '<span class="cal"></span>' : ""}<span>${n.d}</span><b>${n.h.toFixed(1)}</b></button>`).join("")}</div>
    <p class="tally"><span style="color:#5AA9FF">●</span> your calendar's last 14 days show ${NIGHTS.filter((n) => n.cal).length} away games, so those start marked. Tap any night to change it.</p>
    ${reason === EXAMS || [...marked.values()].includes(EXAMS) ? `<p class="tally note">Exam and deadline nights still count. Crunch weeks are a good time to talk to someone too.</p>` : ""}
    <p class="tally">Marked: <b>${marked.size ? byReason() : "none"}</b>. Of the ${left.length} nights that count, <b>${short}</b> were under 6 hours.</p>
    <div class="acts"><button class="a yes" data-go="escdone">Done</button><button class="a no" data-go="escalate">Back</button></div>`;
  },
  escdone: () => {
    const left = NIGHTS.filter((_, i) => !excused(i)), short = left.filter((n) => n.h < 6).length, keep = short >= 5 && short * 2 >= left.length;
    return `<div class="status"><span>Halftime · morning</span><span>only you see this</span></div>
    <h1 class="q" style="font-size:24px;line-height:1.15">${keep ? "Thanks. That still looks like a lot." : "Thanks, that explains it."}</h1>
    <p class="why">${keep ? `Counting everything except the travel, game and shift nights you marked, <b>${short} of ${left.length}</b> nights were still under 6 hours. So this card stays: in the morning, at most once a week. You choose if and when.` : `Counting everything except the travel, game and shift nights you marked, ${short} of ${left.length} nights were short. That's too few nights to call it a pattern, so we'll check again next week.`} <b>Talk to someone</b> is always at the bottom of the screen.</p>
    <div class="acts"><button class="a yes" data-go="idle">Got it</button><button class="a no" data-go="escalate">Back</button></div>`;
  },
  wrong: () => `<div class="status"><span>Halftime · now 3:45</span><span>only you see this</span></div>
    <h1 class="q" style="font-size:24px;line-height:1.15">What looks wrong?</h1>
    <div class="ladder"><button class="rung" data-go="wrongtask"><b>That was one task</b><span>Like switching between Anki, a PDF and notes, or an editor and docs</span></button>
      <button class="rung" data-go="wrongsleep"><b>My sleep number is off</b><span>It came from your watch or ring</span></button>
      <button class="rung" data-go="wrongme"><b>That wasn't me</b><span>Someone else was on this laptop</span></button></div>
    <div class="links"><button data-go="why">Back</button></div>`,
  wrongtask: () => wrongOk("The apps you were switching between now count as one task. Reason 2 is gone for this session, so this suggestion rests on your time and sleep only. It'll learn from this next time too."),
  wrongsleep: () => wrongOk("Sleep is out of today's reasons, and we'll re-check the sync with your watch or ring. If it keeps looking off, you can turn sleep off in Settings."),
  wrongme: () => wrongOk("This laptop's last session is out of your numbers. Next time the laptop wakes, the pill will ask \"Is this you?\" first."),
  escnot: () => `<div class="status"><span>Halftime · morning</span><span>only you see this</span></div>
    <h1 class="q" style="font-size:24px;line-height:1.15">OK. Not now.</h1>
    <p class="why">We won't bring this up again for 7 days, and your walk suggestions carry on as usual. <b>Talk to someone</b> is always at the bottom of the screen.</p>
    <div class="acts"><button class="a yes" data-go="idle">Got it</button><button class="a no" data-go="escalate">Back</button></div>`,
};
const wrongOk = (msg) => `<div class="status"><span>Halftime · now 3:45</span><span>only you see this</span></div>
  <h1 class="q" style="font-size:24px;line-height:1.15">Thanks, noted.</h1>
  <p class="why">${msg}</p>
  <div class="acts"><button class="a yes" data-go="idle">Got it</button><button class="a no" data-go="walk">Back</button></div>`;
// 14 sample nights, Thu Oct 22 to Wed Nov 4 (hours of sleep). 12 are under 6 h; 3 are away games on the calendar.
const NIGHTS = [["Th 22",5.2],["Fr 23",4.8],["Sa 24",4.2,"away game"],["Su 25",3.9,"away game"],["Mo 26",5.6],["Tu 27",6.4],["We 28",5.1],
  ["Th 29",5.5],["Fr 30",5.0],["Sa 31",5.8],["Su 1",4.6,"away game"],["Mo 2",7.1],["Tu 3",5.3],["We 4",5.1]].map(([d, h, cal]) => ({d, h, cal}));
const REASONS = ["Travel or games", "Work shifts", "Exams or deadlines"];
let marked = new Map(NIGHTS.flatMap((n, i) => (n.cal ? [[i, "Travel or games"]] : []))), reason = "Travel or games";
const EXAMS = "Exams or deadlines";
const excused = (i) => marked.has(i) && marked.get(i) !== EXAMS; // travel, games, shifts can explain short sleep; exams and deadlines stay counted
const byReason = () => REASONS.map((r) => [r, [...marked.values()].filter((x) => x === r).length]).filter(([, c]) => c).map(([r, c]) => `${c} ${r.toLowerCase()}`).join(", ");
const morning = new URLSearchParams(location.search).get("state")?.startsWith("esc");
function setPage(mode) {
  page.className = "page " + mode + (morning ? " morning" : "");
  const walking = mode.includes("walking");
  if (morning) {
    document.getElementById("subj").innerHTML = "<span>Thursday</span><span>9:10 am</span>";
    document.getElementById("clock").innerHTML = `9:10<small>am</small>`;
    document.getElementById("since").textContent = "Morning. No study session running.";
    document.getElementById("ctime").textContent = "9:10";
    return;
  }
  document.getElementById("clock").innerHTML = walking ? `2:40<small>paused</small>` : `2:40<small>studying</small>`;
  document.getElementById("since").textContent = walking ? "On a walk. Back at 3:50 pm." : "No break yet this session.";
  document.getElementById("flabel").textContent = walking ? "a break, in progress" : "up to your next stop";
}
const stack = document.getElementById("stack");
function push(on) { // make room: slide the page so the session line sits just below the open island
  if (!on) { stack.style.transform = ""; return; }
  const f = document.querySelector(".forecast"), base = f.getBoundingClientRect().top - (new DOMMatrix(getComputedStyle(stack).transform).m42 || 0);
  const islandBottom = parseFloat(getComputedStyle(island).top) + parseFloat(island.style.height);
  stack.style.transform = `translateY(${Math.max(0, islandBottom + 20 - base)}px)`;
}
function size(pushOn) { const w = Math.min(innerWidth - 24, 480); island.style.width = w + "px"; full.style.width = w + "px"; island.style.height = full.scrollHeight + "px"; push(pushOn); }
function closeFull() { full.inert = true; setTimeout(() => { if (!island.classList.contains("open")) full.innerHTML = ""; }, 520); }
function go(s) {
  island.classList.remove("live");
  if (s === "idle" || s === "snooze") { island.classList.remove("open"); closeFull(); push(false); island.style.width = "170px"; island.style.height = "40px"; setPage(""); return; }
  if (s === "running") { island.classList.remove("open"); closeFull(); push(false); island.classList.add("live"); island.style.width = ""; island.style.height = "44px"; setPage("walking"); return; }
  full.innerHTML = V[s](); full.inert = false;
  island.classList.add("open");
  setPage(s === "walk" || s === "why" ? "speaking suggesting" : s === "runopen" ? "speaking walking" : s === "keep" ? "speaking keeping" : "speaking");
  requestAnimationFrame(() => size(["walk", "keep", "nodata", "runopen", "wrong", "wrongtask", "wrongsleep", "wrongme"].includes(s)));
}
island.addEventListener("click", (e) => {
  const n = e.target.closest("[data-night]"), r = e.target.closest("[data-reason]");
  if (n) { const i = +n.dataset.night; marked.has(i) ? marked.delete(i) : marked.set(i, reason); return redraw(); }
  if (r) { reason = r.dataset.reason; return redraw(); }
  const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go);
});
function redraw() { const y = full.scrollTop; full.innerHTML = V.escctx(); full.scrollTop = y; size(false); }
document.getElementById("compact").addEventListener("click", () => go("walk"));
document.getElementById("liveview").addEventListener("click", () => go("runopen"));
addEventListener("resize", () => island.classList.contains("open") && size(page.classList.contains("suggesting") || page.classList.contains("keeping")));
const start = new URLSearchParams(location.search).get("state") || "walk";
if (new URLSearchParams(location.search).get("pick") === "exams") { reason = EXAMS; [0, 1, 4, 6, 7, 8].forEach((i) => marked.set(i, EXAMS)); } // capture helper: the exam-nights example
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (start === "running" || start === "idle") go(start); else setTimeout(() => go(V[start] ? start : "walk"), reduce ? 0 : 450);
</script>
</body>
