<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C9DDF2">
<title>Flip · receipts on the back concept</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Concept: one word you can't miss, on a field of colour that sets the mood (never a verdict:
   sky for a walk, sand for keep going, dusk for a longer break). The card is a physical thing:
   swipe it up to take the walk, down to keep going, and flip it over for the receipts,
   every number with its source, time and your usual range. Showing your work is the signature. */
:root{
  --field:#C9DDF2; --ink:#15171A; --ink2:#3C4148; --muted:#4B5159; --card:#FFFDF8; --rule:#E7E2D8; --track:#ECE7DD; --band:#C7D7E8;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --spring:cubic-bezier(.32,.72,0,1); --ease:cubic-bezier(.23,1,.32,1); --io:cubic-bezier(.77,0,.175,1);
}
.keep{--field:#EFE2CC;--band:#E3D3B6}.brk{--field:#E9D3CB;--band:#E0C2B8}.fog{--field:#DCDDD9;--band:#C9CBC6}.paper{--field:#F3EFE8;--band:#E3DED4}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{min-height:100dvh;background:var(--field);color:var(--ink);font:400 16px/1.45 var(--display);font-variant-numeric:tabular-nums;transition:background .5s ease}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:12px}
.app{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 18px calc(env(safe-area-inset-bottom,0px) + 12px)}
.top{display:flex;justify-content:space-between;align-items:center;min-height:40px;font:600 13px/1 var(--mono);letter-spacing:.02em}
.top .w{font:800 19px/1 var(--display);letter-spacing:-.02em}
.top .s{color:var(--muted)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;perspective:1400px;padding:14px 0}
.card{position:relative;touch-action:none;animation:land .7s var(--spring) both}
@keyframes land{from{transform:translateY(40px) rotate(-2deg);opacity:0}}
.card.flipped .front{display:none}.card:not(.flipped) .back{display:none}
.face{display:flex;flex-direction:column;background:var(--card);border-radius:30px;padding:22px 22px 18px;
  box-shadow:0 1px 0 rgba(0,0,0,.04),0 22px 50px -18px rgba(20,25,35,.35)}

.status{display:flex;justify-content:space-between;font:500 12px/1 var(--mono);color:var(--muted)}
.word{font:800 clamp(92px,30vw,132px)/.86 var(--display);letter-spacing:-.055em;margin:18px 0 10px;font-variation-settings:"opsz" 96}
.word.mid{font-size:clamp(64px,19vw,86px);letter-spacing:-.045em}
.sub{font:500 21px/1.2 var(--display);letter-spacing:-.015em}
.because{font:400 16px/1.45 var(--display);color:var(--ink2);margin-top:12px;margin-bottom:18px}
.because b{color:var(--ink);font-weight:700}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border-radius:8px;background:var(--field);font:600 12px/1 var(--mono);margin-left:3px;vertical-align:1px;position:relative}
.chip::after{content:"";position:absolute;inset:-10px -4px}
.odds{display:flex;align-items:center;gap:14px;margin-top:4px;padding-top:14px;border-top:1px dashed var(--rule)}
.frac{font:800 44px/1 var(--display);letter-spacing:-.04em}
.frac small{font-size:24px;color:var(--muted)}
.odds p{font:400 14px/1.35 var(--display);color:var(--ink2)}
.odds b{color:var(--ink)}
.flipbtn{display:flex;align-items:center;gap:8px;margin-top:12px;min-height:44px;font:600 14px/1 var(--mono);color:var(--ink)}
.flipbtn svg{transition:transform .4s var(--ease)}
.flipbtn:hover svg{transform:rotate(180deg)}
/* the receipts */
.rhead{display:flex;justify-content:space-between;align-items:baseline}
.rhead h2{font:800 34px/1 var(--display);letter-spacing:-.04em}
.rhead span{font:500 12px/1 var(--mono);color:var(--muted)}
.line{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px dashed var(--rule)}
.line .k{font:600 15px/1.25 var(--display)}.line .v{font:600 15px/1.25 var(--mono)}
.line .m{grid-column:1/-1;font:400 12px/1.35 var(--mono);color:var(--muted)}
.rng{grid-column:1/-1;position:relative;height:8px;border-radius:4px;background:var(--track);margin-top:8px}
.rng span{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--band)}
.rng em{position:absolute;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--ink);border:3px solid var(--card)}
.rng i{position:absolute;top:14px;font:400 11px/1 var(--mono);color:var(--muted);font-style:normal;white-space:nowrap}
.total{display:grid;grid-template-columns:1fr auto;padding:14px 0 4px;font:800 18px/1.2 var(--display)}
.cant{font:400 12.5px/1.4 var(--mono);color:var(--muted);margin-top:8px}
.backlinks{display:flex;justify-content:space-between;margin-top:6px}
.backlinks button{min-height:44px;font:600 14px/1 var(--mono)}
/* the decision */
.decide{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d{min-height:58px;border-radius:29px;font:700 18px/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s var(--ease)}
.d:active{transform:scale(.96)}
.d.yes{background:var(--ink);color:var(--card)}.d.no{background:rgba(255,255,255,.55);color:var(--ink);box-shadow:inset 0 0 0 1.5px rgba(21,23,26,.22)}
.hint{text-align:center;font:500 12px/1 var(--mono);color:var(--muted);margin-top:10px}
.foot{display:flex;justify-content:space-between;margin-top:4px}
.foot button{min-height:44px;font:500 13px/1 var(--mono);color:var(--ink2)}
/* break running */
.run{flex:1;display:flex;flex-direction:column;justify-content:center;animation:land .6s var(--spring) both}
.run .cd{font:800 clamp(150px,50vw,210px)/.82 var(--display);letter-spacing:-.06em}
.run .line1{font:700 28px/1.1 var(--display);letter-spacing:-.02em;margin-top:18px}
.run p{font:400 17px/1.45 var(--display);color:var(--ink2);margin-top:8px;max-width:30ch}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.55);margin-top:22px;overflow:hidden}.bar i{display:block;height:100%;width:16%;background:var(--ink);border-radius:5px}
.ladder{display:grid;gap:8px;margin-top:16px}
.rung{text-align:left;border-radius:20px;padding:13px 16px;min-height:60px;background:var(--field)}
.rung b{display:block;font:700 17px/1.25 var(--display)}.rung span{font:400 13px/1.3 var(--mono);color:var(--ink2)}
.rung.first{background:var(--ink);color:var(--card)}.rung.first span{color:#D6D3CC}
.learn{display:flex;gap:6px;margin-top:14px}.learn i{flex:1;height:10px;border-radius:5px;background:var(--track)}.learn i.on{background:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
@media (max-height:700px){.word{font-size:84px;margin:10px 0 6px}.sub{font-size:18px}.because{font-size:15px;margin-top:8px}.frac{font-size:34px}.d{min-height:52px}.stage{padding:6px 0}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
// Sample data only. Words: UIUX proposal on the CMO seat's voice A (COPY.md); the CMO locks them.
const app = document.getElementById("app");
const chip = (k, l) => `<button class="chip" aria-label="Source ${k}: ${l}">${k}</button>`;
const flipIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>`;
const hdr = `<header class="top"><span class="w">Halftime</span><span class="s">Sample data</span></header>`;
const foot = `<nav class="foot"><button>Talk to someone</button><button>Pause suggestions</button></nav>`;
const receipts = (rows, total) => `<div class="face back" aria-label="The receipts">
  <div class="rhead"><h2>The receipts</h2><span>ranked by weight</span></div>
  ${rows.map((r) => `<div class="line"><span class="k">${r[0]}</span><span class="v">${r[1]}</span><span class="m">${r[2]}</span>
    <span class="rng" aria-hidden="true"><span style="left:${r[3]}%;width:${r[4]}%"></span><em style="left:${r[5]}%"></em></span><span style="height:12px"></span></div>`).join("")}
  <div class="total"><span>${total[0]}</span><span>${total[1]}</span></div>
  <p class="cant">We only see which kind of app you're in. Never what you type, read or browse.</p>
  <div class="backlinks"><button>This looks wrong</button><button data-flip>${flipIcon.replace('width="18"', 'width="16"')} Flip back</button></div></div>`;
const S = {
  walk: { cls: "", front: `<div class="face front">
      <div class="status"><span>now · 3:45 pm</span><span>2 h 40 min in</span></div>
      <h1 class="word">Walk.</h1>
      <p class="sub">Five minutes, then back to orgo.</p>
      <p class="because">You've been at it <b>2 h 40 min</b>${chip(1, "session time, laptop")}, switched apps <b>14 times</b> in 20 min${chip(2, "app switches, laptop")}, and slept <b>5 h 10 min</b>${chip(3, "sleep, watch")}.</p>
      <div class="odds"><span class="frac">4<small>/6</small></span><p><b>Fairly sure.</b> A walk helped in 4 of your last 6 afternoons like this.</p></div>
      <button class="flipbtn" data-flip>${flipIcon} Flip for the receipts</button></div>`,
    back: receipts([["1 · Session time", "2 h 40 min", "laptop · 1 min ago · usual 45–90 min", 25, 25, 89], ["2 · App switches", "14 / 20 min", "laptop · 1 min ago · usual 5–8", 25, 15, 70], ["3 · Sleep last night", "5 h 10 min", "watch · synced 38 min ago · usual about 7 h", 53, 17, 23]], ["Walks helped, afternoons like this", "4 of 6"]),
    yes: ["Walk 5 min", "running"], no: ["Keep going", "keep"] },
  keep: { cls: "keep", front: `<div class="face front">
      <div class="status"><span>now · 3:45 pm</span><span>35 min in</span></div>
      <h1 class="word mid">Keep going.</h1>
      <p class="sub">Nothing to change right now.</p>
      <p class="because"><b>35 min</b> in${chip(1, "session time")}, only <b>2 switches</b> in 20 min${chip(2, "app switches")}, and a usual night's sleep${chip(3, "sleep")}.</p>
      <div class="odds"><span class="frac">6<small>/8</small></span><p><b>Fairly sure.</b> Your scores held up past the hour in 6 of your last 8 sessions like this.</p></div>
      <button class="flipbtn" data-flip>${flipIcon} Flip for the receipts</button></div>`,
    back: receipts([["1 · Session time", "35 min", "laptop · just now · usual 45–90 min", 25, 25, 19], ["2 · App switches", "2 / 20 min", "laptop · just now · usual 5–8", 25, 15, 10], ["3 · Sleep last night", "7 h 05 min", "watch · synced 12 min ago · usual about 7 h", 53, 17, 62]], ["Held up, sessions like this", "6 of 8"]),
    yes: ["Keep going", "keep"], no: ["Break anyway", "running"] },
  break: { cls: "brk", front: `<div class="face front">
      <div class="status"><span>now · 3:45 pm</span><span>3 h 10 min in</span></div>
      <h1 class="word">Rest.</h1>
      <p class="sub">A proper 15-minute break.</p>
      <p class="because"><b>3 h 10 min</b> without a break${chip(1, "session time")}, and the last practice round went from <b>9 of 10</b> to <b>6 of 10</b>${chip(2, "practice results")}.</p>
      <div class="odds"><span class="frac">5<small>/7</small></span><p><b>Fairly sure.</b> After a break, your next round went up in 5 of your last 7 long sessions.</p></div>
      <button class="flipbtn" data-flip>${flipIcon} Flip for the receipts</button></div>`,
    back: receipts([["1 · Practice rounds", "9 → 6 of 10", "problem set 4 · last 2 rounds", 60, 25, 30], ["2 · Session time", "3 h 10 min", "laptop · 1 min ago · usual 45–90 min", 25, 25, 95], ["3 · Sleep last night", "6 h 55 min", "watch · synced 20 min ago · usual about 7 h", 53, 17, 58]], ["Next round went up after a break", "5 of 7"]),
    yes: ["Break 15 min", "running"], no: ["Keep going", "keep"] },
  nodata: { cls: "fog", front: `<div class="face front">
      <div class="status"><span>learning</span><span>4 of 7 nights</span></div>
      <h1 class="word">Soon.</h1>
      <p class="sub">Still learning your usual sleep.</p>
      <div class="learn" role="img" aria-label="4 of 7 nights">${[1,1,1,1,0,0,0].map((x) => `<i class="${x ? "on" : ""}"></i>`).join("")}</div>
      <p class="because">Suggestions start around Sunday. What we can say: you've been at it <b>1 h 50 min</b>. A walk or a break is always up to you.</p>
      <div class="odds"><span class="frac">?</span><p><b>Not sure yet.</b> Too few nights to compare.</p></div></div>`,
    back: "", yes: ["Keep going", "keep"], no: ["Walk anyway", "running"] },
};
function cardView(k) {
  const s = S[k];
  document.body.className = s.cls;
  app.innerHTML = `${hdr}<section class="stage"><div class="card" id="card" tabindex="-1">${s.front}${s.back}</div></section>
    <div class="decide"><button class="d yes" data-go="${s.yes[1]}">${s.yes[0]} <span aria-hidden="true">↑</span></button><button class="d no" data-go="${s.no[1]}">${s.no[0]} <span aria-hidden="true">↓</span></button></div>
    <p class="hint">or swipe the card up or down</p>${foot}`;
  drag(document.getElementById("card"), s);
}
function runView() {
  document.body.className = "";
  app.innerHTML = `${hdr}<section class="run" aria-label="Break running"><p class="cd" aria-label="4 minutes 12 seconds left">4:12</p>
    <p class="line1">Walk. Water. Window.</p><p>Your study clock is paused. Back at 3:50 pm, right where you left off.</p>
    <div class="bar" aria-hidden="true"><i></i></div></section>
    <div class="decide"><button class="d no" data-go="walk">End break</button><button class="d no">+5 min</button></div>${foot}`;
}
function escView() {
  document.body.className = "paper";
  app.innerHTML = `${hdr}<section class="stage"><div class="card"><div class="face front">
    <div class="status"><span>only you see this</span><span>14 nights</span></div>
    <h1 class="word mid" style="font-size:clamp(44px,13vw,56px);letter-spacing:-.035em;line-height:.95">12 of 14 nights under 6 hours.</h1>
    <p class="because">That's a long stretch. Talking it over with someone can help. You choose if and when.</p>
    <div class="ladder"><button class="rung first"><b>Talk to someone now</b><span>[Campus counseling, 24/7: confirm]</span></button>
      <button class="rung"><b>Book a time</b><span>[Counseling booking: confirm]</span></button>
      <button class="rung"><b>Something for right now</b><span>2 quiet minutes</span></button></div>
    <p class="cant">We never contact anyone for you. If you're in danger, call [emergency line: confirm].</p></div></div></section>
    <div class="decide"><button class="d no">Not now</button><button class="d no">Why this?</button></div>${foot}`;
}
function drag(el, s) {
  let y0 = null, t0 = 0, dy = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  el.addEventListener("pointerdown", (e) => { if (e.target.closest("button") || el.classList.contains("flipped")) return; y0 = e.clientY; t0 = performance.now(); el.setPointerCapture(e.pointerId); el.style.transition = "none"; });
  el.addEventListener("pointermove", (e) => { if (y0 === null) return; dy = e.clientY - y0; const r = dy / (1 + Math.abs(dy) / 260); el.style.transform = `translateY(${r}px) rotate(${r / 40}deg)`; });
  const end = () => { if (y0 === null) return; const v = Math.abs(dy) / (performance.now() - t0); el.style.transition = ""; const commit = Math.abs(dy) > 110 || v > .5;
    if (commit && !reduce) { el.style.transform = `translateY(${dy < 0 ? -900 : 900}px) rotate(${dy < 0 ? -6 : 6}deg)`; setTimeout(() => go(dy < 0 ? s.yes[1] : s.no[1]), 260); }
    else if (commit) go(dy < 0 ? s.yes[1] : s.no[1]); else el.style.transform = ""; y0 = null; dy = 0; };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end); el.addEventListener("lostpointercapture", end);
}
function flip(card) {
  // turn to edge-on, swap faces, turn back in: no reliance on 3D backface support
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || !card.animate) { card.classList.toggle("flipped"); return; }
  card.animate([{ transform: "perspective(1200px) rotateY(0)" }, { transform: "perspective(1200px) rotateY(90deg)" }], { duration: 170, easing: "cubic-bezier(.5,0,.75,0)" }).onfinish = () => {
    card.classList.toggle("flipped");
    card.animate([{ transform: "perspective(1200px) rotateY(-90deg)" }, { transform: "perspective(1200px) rotateY(0)" }], { duration: 300, easing: "cubic-bezier(.23,1,.32,1)" });
  };
}
function go(k) {
  if (k === "running") return runView();
  if (k === "escalate") return escView();
  if (k === "why") { cardView("walk"); requestAnimationFrame(() => document.getElementById("card").classList.add("flipped")); return; }
  cardView(S[k] ? k : "walk");
}
app.addEventListener("click", (e) => {
  if (e.target.closest("[data-flip]")) { flip(document.getElementById("card")); return; }
  const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go);
});
go(new URLSearchParams(location.search).get("state") || "walk");
</script>
</body>
</html>
